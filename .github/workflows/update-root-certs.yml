name: Daily Root Certs Update Check

on:
  schedule:
    - cron: "0 0 * * *" # Runs at 00:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  check-and-update:
    if: github.repository == 'oven-sh/bun'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest

      - name: Generate root certs and capture output
        id: generate-certs
        run: |
          cd packages/bun-usockets/
          certificate_output=$(bun generate-root-certs.mjs -v)
          printf 'cert_output<<EOF\n%s\nEOF\n' "$certificate_output" >> "$GITHUB_ENV"

      - name: Check for changes and stage files
        id: check-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Found changes, staging modified files..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add --all
            printf 'changes=true\n' >> "$GITHUB_OUTPUT"

            changed_files=$(git status --porcelain)
            printf 'changed_files<<EOF\n%s\nEOF\n' "$changed_files" >> "$GITHUB_ENV"
          else
            echo "No changes detected"
            printf 'changes=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update(root_certs): Update root certificates $(date +'%Y-%m-%d')"
          title: "update(root_certs) $(date +'%Y-%m-%d')"
          body: |
            Automated root certificates update

            ${{ env.cert_output }}

            ## Changed Files:
            ```
            ${{ env.changed_files }}
            ```
          branch: certs/update-root-certs
          base: main
          delete-branch: true
          labels: |
            automation
            root-certs
